<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="">
  <title>Phi PDF Preview</title>
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="export-preview.css">
  <script src="mathjax-config.js"></script>
  <script defer src="export-preview.js"></script>
</head>
<body class="export-preview-mode">
  <main id="export-preview" aria-label="PDF document preview">
    <div id="pdf-stage" class="pdf-stage">
      <article id="pdf-document" class="pdf-document">
        <div id="pdf-scaled-content" class="pdf-scaled-content">
          <header id="pdf-cover" class="pdf-cover" hidden>
            <h1 id="pdf-title"></h1>
            <p id="pdf-author"></p>
          </header>
          <div id="pdf-sections"></div>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
